{
  "$kind": "http-request",
  "order": 2000,
  "method": "GET",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/categories",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 200', () => pm.response.to.have.status(200));\n\nconst categories = pm.response.json().items; pm.collectionVariables.set('expense_category', categories.find(c => c.name === 'Продукты').id); pm.collectionVariables.set('income_category', categories.find(c => c.name === 'Зарплата').id); pm.test('11 initial categories', () => pm.expect(categories).to.have.length(11));"
    }
  ]
}
