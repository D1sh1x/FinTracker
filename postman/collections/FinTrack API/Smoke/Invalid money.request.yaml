{
  "$kind": "http-request",
  "order": 18000,
  "method": "POST",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/transactions",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 422', () => pm.response.to.have.status(422));\npm.test('Structured error', () => { const e=pm.response.json().error; pm.expect(e.code).to.be.a('string'); pm.expect(e.request_id).to.be.a('string'); });\n"
    }
  ],
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"id\": \"{{invalid_id}}\",\n  \"type\": \"expense\",\n  \"amount_minor\": 100,\n  \"category_id\": \"{{expense_category}}\",\n  \"occurred_on\": \"{{today}}\",\n  \"note\": \"Продукты на неделю\"\n}"
  }
}
