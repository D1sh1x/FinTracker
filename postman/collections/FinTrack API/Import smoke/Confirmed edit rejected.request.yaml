{
  "$kind": "http-request",
  "name": "Confirmed edit rejected",
  "description": "Save corrected fields with optimistic version",
  "order": 4000,
  "method": "PATCH",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/imports/{{import_id}}/rows",
  "headers": {
    "Content-Type": "application/json"
  },
  "body": {
    "type": "json",
    "content": "{\"version\":{{final_version}},\"rows\":[]}"
  },
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 409',()=>pm.response.to.have.status(409));\npm.test('Structured error',()=>pm.expect(pm.response.json().error.code).to.be.a('string'));\n"
    }
  ]
}
