{
  "$kind": "http-request",
  "name": "Confirmed cancel rejected",
  "description": "Cancel processing/draft without financial writes",
  "order": 5000,
  "method": "POST",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/imports/{{import_id}}/cancel",
  "headers": {
    "Content-Type": "application/json"
  },
  "body": {
    "type": "json",
    "content": "{\"version\":{{final_version}}}"
  },
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 409',()=>pm.response.to.have.status(409));\npm.test('Structured error',()=>pm.expect(pm.response.json().error.code).to.be.a('string'));\n"
    }
  ]
}
