$kind: http-request
name: Задать или изменить лимит категории
description: "Создание без version: 201. Обновление с текущей version: 200. Отсутствующая/устаревшая версия при обновлении: 409 stale_version. Новые лимиты архивных категорий: 409 category_archived; доходная категория: 422; чужая категория: 404. Существующий лимит архивной категории можно изменять. После удаления повторное создание без version продолжает нумерацию версий. Не требует общего бюджета и не изменяет его. Лимит — положительная строка копеек до 99999999999."
url: "{{baseUrl}}/api/v1/profiles/:p/category-budgets/:month/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: p
    value: a494a5ed-d787-ac66-08a5-a9985035873e
    disabled: false
    description: "(Required) "
  - key: month
    value: 0576-01
    disabled: false
    description: "(Required) "
  - key: id
    value: 092bd59c-7903-bfe9-6b8d-1b3e90e0d0c9
    disabled: false
    description: (Required) UUID расходной категории этого профиля
body:
  type: json
  content: |-
    {
      "limit_minor": "9418",
      "version": 966
    }
settings: {}
examples: ./.resources/Задать или изменить лимит категори.resources/examples
order: 2000
