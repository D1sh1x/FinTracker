{
  "$kind": "http-request",
  "name": "Stale valuation rejected",
  "order": 17000,
  "method": "POST",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/accounts/{{investment_id}}/valuations",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 409',()=>pm.response.to.have.status(409));\npm.test('Structured error',()=>pm.expect(pm.response.json().error.code).to.be.a('string'));\n"
    }
  ],
  "headers": {
    "Content-Type": "application/json"
  },
  "body": {
    "type": "json",
    "content": "{\n  \"id\": \"{{stale_valuation_id}}\",\n  \"amount_minor\": \"300000\",\n  \"expected_balance_minor\": \"0\",\n  \"version\": 1\n}"
  }
}
