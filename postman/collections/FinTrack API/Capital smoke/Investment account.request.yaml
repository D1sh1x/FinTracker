{
  "$kind": "http-request",
  "name": "Investment account",
  "order": 5000,
  "method": "POST",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/accounts",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 201',()=>pm.response.to.have.status(201));\n\n"
    }
  ],
  "headers": {
    "Content-Type": "application/json"
  },
  "body": {
    "type": "json",
    "content": "{\n  \"id\": \"{{investment_id}}\",\n  \"name\": \"Портфель\",\n  \"kind\": \"investment\",\n  \"opening_balance_minor\": \"200000\",\n  \"tracking_start_date\": \"{{today}}\"\n}"
  }
}
