{
  "$kind": "http-request",
  "name": "Capital after valuation",
  "order": 11000,
  "method": "GET",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/capital",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 200',()=>pm.response.to.have.status(200));\n\nconst x=pm.response.json();pm.test('Transfer preserved capital; valuation changed it',()=>{pm.expect(x.total_minor).to.equal('1250000');pm.expect(x.cash_minor).to.equal('950000');pm.expect(x.investment_minor).to.equal('300000');pm.expect(x.history.at(-1).balance_minor).to.equal(x.total_minor);});"
    }
  ]
}
