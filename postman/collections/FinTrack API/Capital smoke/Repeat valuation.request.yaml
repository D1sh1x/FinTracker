{
  "$kind": "http-request",
  "name": "Repeat valuation",
  "order": 10000,
  "method": "POST",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/accounts/{{investment_id}}/valuations",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 200',()=>pm.response.to.have.status(200));\n\n"
    }
  ],
  "headers": {
    "Content-Type": "application/json"
  },
  "body": {
    "type": "json",
    "content": "{\n  \"id\": \"{{valuation_id}}\",\n  \"amount_minor\": \"300000\",\n  \"expected_balance_minor\": \"250000\",\n  \"version\": 1\n}"
  }
}
