{
  "$kind": "http-request",
  "name": "Deleted transfer retry",
  "order": 15000,
  "method": "POST",
  "url": "{{baseUrl}}/api/v1/profiles/{{profile_id}}/transfers",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 410',()=>pm.response.to.have.status(410));\npm.test('Structured error',()=>pm.expect(pm.response.json().error.code).to.be.a('string'));\n"
    }
  ],
  "headers": {
    "Content-Type": "application/json"
  },
  "body": {
    "type": "json",
    "content": "{\n  \"id\": \"{{transfer_id}}\",\n  \"from_account_id\": \"{{primary_id}}\",\n  \"to_account_id\": \"{{investment_id}}\",\n  \"amount_minor\": \"50000\",\n  \"occurred_on\": \"{{today}}\"\n}"
  }
}
