{
  "$kind": "http-request",
  "name": "Import purchase",
  "order": 3000,
  "method": "POST",
  "url": "{{baseUrl}}/api/v1/profiles/{{push_profile}}/notification-imports",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 201',()=>pm.response.to.have.status(201));\npm.collectionVariables.set('push_transaction',pm.response.json().transaction_id);pm.test('Receipt',()=>pm.expect(pm.response.json().status).to.eql('imported'));"
    }
  ],
  "headers": {
    "Content-Type": "application/json"
  },
  "body": {
    "type": "json",
    "content": "{\n  \"id\": \"{{push_id}}\",\n  \"wallet_id\": \"{{push_wallet}}\",\n  \"package_name\": \"ru.wildberries.bank\",\n  \"posted_at\": \"{{push_time}}\",\n  \"text\": \"Покупка 43 ₽ по карте *7055 Транспорт Краснодара. Доступно 933,48 ₽\"\n}"
  }
}
