{
  "$kind": "http-request",
  "order": 4000,
  "method": "POST",
  "url": "{{baseUrl}}/api/lab/text",
  "scripts": [
    {
      "type": "afterResponse",
      "language": "text/javascript",
      "code": "pm.test('HTTP 422',()=>pm.response.to.have.status(422));\npm.test('Structured input error',()=>pm.expect(pm.response.json().error.code).to.equal('invalid_input'));"
    }
  ],
  "headers": [
    {
      "key": "Content-Type",
      "value": "application/json"
    }
  ],
  "body": {
    "type": "json",
    "content": "{\n  \"text\": \"Покупка -500 ₽\",\n  \"capture_date\": \"invalid\"\n}"
  }
}
