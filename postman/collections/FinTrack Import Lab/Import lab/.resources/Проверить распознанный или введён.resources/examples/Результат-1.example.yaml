$kind: http-example
name: Результат
request:
  url: "{{baseUrl}}/api/lab/text"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "text": "string",
        "capture_date": "string"
      }
response:
  statusCode: 408
  statusText: Request Timeout
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string"
        }
      }
order: 2000
